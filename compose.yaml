name: vrum

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: vrum
      POSTGRES_DB: vrum
      # Optional. Only read the first time, to choose the password (see the entrypoint below).
      VRUM_DB_PASSWORD: ${VRUM_DB_PASSWORD:-}
    # Nothing has to be set up to start Vrum. The first time this runs it makes a random database
    # password and keeps it in a volume of its own, which the server reads (the database is not
    # reachable from outside Docker, and no two installs share a password). Set VRUM_DB_PASSWORD
    # before the very first start to choose the password yourself; it is ignored afterwards.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -s /secrets/db-password ]; then
          if [ -z "$$VRUM_DB_PASSWORD" ] && [ -e /var/lib/postgresql/data/PG_VERSION ]; then
            echo "This database already exists, but the file that holds its password is gone." >&2
            echo "Set VRUM_DB_PASSWORD to its password, or, to start again with an empty" >&2
            echo "database (this deletes the data), run: docker compose down --volumes" >&2
            exit 1
          fi
          umask 022
          if [ -n "$$VRUM_DB_PASSWORD" ]; then
            printf '%s' "$$VRUM_DB_PASSWORD" > /secrets/db-password
          else
            head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/db-password
          fi
        fi
        export POSTGRES_PASSWORD_FILE=/secrets/db-password
        exec docker-entrypoint.sh postgres
    volumes:
      - vrum-data:/var/lib/postgresql/data
      - vrum-secrets:/secrets
    healthcheck:
      # Over TCP on purpose: during first-time setup the database only listens on its socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vrum -d vrum"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      VRUM_HOST: 0.0.0.0
      VRUM_PORT: ${VRUM_PORT:-8000}
      VRUM_DB_HOST: db
      VRUM_DB_PASSWORD_FILE: /secrets/db-password
      VRUM_MAX_REQUEST_BYTES: ${VRUM_MAX_REQUEST_BYTES:-}
      VRUM_BOARD_POLL_SECONDS: ${VRUM_BOARD_POLL_SECONDS:-}
      # The embedding service, for search by meaning (see .env.example). The default is the small
      # one in this project (the `embeddings` service below), so search by meaning works with
      # nothing set. Set both to use a service of your own, or set EMBEDDING_BASE_URL to nothing
      # to go without one (then search works by exact words only).
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL-http://embeddings:8080/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL-all-MiniLM-L6-v2}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MAX_CHARS: ${EMBEDDING_MAX_CHARS:-}
      EMBEDDING_MIN_SIMILARITY: ${EMBEDDING_MIN_SIMILARITY:-}
      EMBEDDING_OVERLAP_THRESHOLD: ${EMBEDDING_OVERLAP_THRESHOLD:-}
      EMBEDDING_REINDEX_SECONDS: ${EMBEDDING_REINDEX_SECONDS:-}
      # Email, if any (invitations, confirming an address, choosing a new password): see
      # .env.example. Without VRUM_SMTP_HOST nothing is sent and none of those exist.
      VRUM_PUBLIC_URL: ${VRUM_PUBLIC_URL:-}
      VRUM_SMTP_HOST: ${VRUM_SMTP_HOST:-}
      VRUM_SMTP_PORT: ${VRUM_SMTP_PORT:-}
      VRUM_SMTP_SECURITY: ${VRUM_SMTP_SECURITY:-}
      VRUM_SMTP_USER: ${VRUM_SMTP_USER:-}
      VRUM_SMTP_PASSWORD: ${VRUM_SMTP_PASSWORD:-}
      VRUM_SMTP_FROM: ${VRUM_SMTP_FROM:-}
      # Outgoing webhooks (M48) are always available to a project's owner. These two widen what
      # an address may be: names, addresses or networks that may be reached although they are not
      # public ones, and http for a receiver on this machine. See .env.example.
      VRUM_WEBHOOK_ALLOWED_HOSTS: ${VRUM_WEBHOOK_ALLOWED_HOSTS:-}
      VRUM_WEBHOOK_ALLOW_INSECURE_HTTP: ${VRUM_WEBHOOK_ALLOW_INSECURE_HTTP:-}
      # Signing in with another provider, if any (OpenID Connect, GitHub, LDAP): see .env.example.
      # Without VRUM_OIDC_ISSUER, VRUM_GITHUB_CLIENT_ID and VRUM_LDAP_URL there is none.
      VRUM_SSO_CREATE_ACCOUNTS: ${VRUM_SSO_CREATE_ACCOUNTS:-}
      VRUM_SSO_ALLOW_INSECURE_HTTP: ${VRUM_SSO_ALLOW_INSECURE_HTTP:-}
      VRUM_OIDC_ISSUER: ${VRUM_OIDC_ISSUER:-}
      VRUM_OIDC_CLIENT_ID: ${VRUM_OIDC_CLIENT_ID:-}
      VRUM_OIDC_CLIENT_SECRET: ${VRUM_OIDC_CLIENT_SECRET:-}
      VRUM_OIDC_NAME: ${VRUM_OIDC_NAME:-}
      VRUM_OIDC_SCOPES: ${VRUM_OIDC_SCOPES:-}
      VRUM_OIDC_ALLOWED_DOMAINS: ${VRUM_OIDC_ALLOWED_DOMAINS:-}
      VRUM_GITHUB_CLIENT_ID: ${VRUM_GITHUB_CLIENT_ID:-}
      VRUM_GITHUB_CLIENT_SECRET: ${VRUM_GITHUB_CLIENT_SECRET:-}
      VRUM_GITHUB_URL: ${VRUM_GITHUB_URL:-}
      VRUM_GITHUB_AUTHORIZE_URL: ${VRUM_GITHUB_AUTHORIZE_URL:-}
      VRUM_GITHUB_API_URL: ${VRUM_GITHUB_API_URL:-}
      VRUM_GITHUB_ALLOWED_DOMAINS: ${VRUM_GITHUB_ALLOWED_DOMAINS:-}
      VRUM_LDAP_URL: ${VRUM_LDAP_URL:-}
      VRUM_LDAP_SECURITY: ${VRUM_LDAP_SECURITY:-}
      VRUM_LDAP_BIND_DN: ${VRUM_LDAP_BIND_DN:-}
      VRUM_LDAP_BIND_PASSWORD: ${VRUM_LDAP_BIND_PASSWORD:-}
      VRUM_LDAP_BASE_DN: ${VRUM_LDAP_BASE_DN:-}
      VRUM_LDAP_USER_FILTER: ${VRUM_LDAP_USER_FILTER:-}
      VRUM_LDAP_EMAIL_ATTRIBUTE: ${VRUM_LDAP_EMAIL_ATTRIBUTE:-}
      VRUM_LDAP_NAME_ATTRIBUTE: ${VRUM_LDAP_NAME_ATTRIBUTE:-}
      VRUM_LDAP_ID_ATTRIBUTE: ${VRUM_LDAP_ID_ATTRIBUTE:-}
      VRUM_LDAP_NAME: ${VRUM_LDAP_NAME:-}
      VRUM_LDAP_ALLOWED_DOMAINS: ${VRUM_LDAP_ALLOWED_DOMAINS:-}
    volumes:
      - vrum-secrets:/secrets:ro
      # The socket of the sandbox (below). Read-only is enough to connect to it; the group lets the
      # app use a socket that belongs to the sandbox's group.
      - vrum-sandbox:/run/sandbox:ro
    group_add:
      - "10003"
    ports:
      # The same port inside and outside, because the server only accepts requests addressed to
      # localhost on that port. Bound to this machine only unless VRUM_BIND_ADDRESS says otherwise.
      - "${VRUM_BIND_ADDRESS:-127.0.0.1}:${VRUM_PORT:-8000}:${VRUM_PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "-m", "vrum.healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  # The embedding service Vrum uses by default, for search by meaning, similar items and possible
  # duplicates: a small open-source model (all-MiniLM-L6-v2) that runs on the processor, built from
  # embedder/ with the model files inside the image, so it needs no internet once built and
  # downloads nothing when it starts. It turns text into numbers and nothing else, and no port of
  # it is published: only the app reaches it. The app does not wait for it: Vrum starts and
  # answers while it is still warming up, and says plainly that only exact words were searched
  # until it answers. To use another service, or none, see EMBEDDING_BASE_URL in .env.example.
  embeddings:
    build: ./embedder
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)
      interval: 5s
      timeout: 4s
      start_period: 20s
      retries: 20

  # The sandbox of code mode, where the scripts agents write are run (see docs/agents.md): built from
  # sandbox/, with Deno inside at a pinned version. A script can reach only what the app lets it reach
  # through the socket in the shared volume: this container has no network at all, no secret, no
  # database, a read-only root file system, no capabilities, no root user, and limits on memory,
  # processes and processor time. The app does not wait for it: Vrum starts and answers while it is
  # still starting, and `run` says plainly that it is not available until it answers. To go without
  # it, start with `docker compose up -d --build --wait --scale sandbox=0`.
  sandbox:
    build: ./sandbox
    init: true
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 128
    cpus: 2
    tmpfs:
      - /tmp:uid=10002,gid=10003,mode=0700,size=64m
      - /deno:uid=10002,gid=10003,mode=0700,size=128m
    volumes:
      - vrum-sandbox:/run/sandbox
    # Healthy when its supervisor answers a ping on the socket (the health check is in sandbox/Dockerfile).

volumes:
  vrum-data:
  vrum-secrets:
  vrum-sandbox:
