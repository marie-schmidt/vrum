[project]
name = "vrum"
version = "0.1.0"
description = "A self-hosted project graph for AI agents, served over MCP."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.3,<3",
    "psycopg[binary,pool]>=3.2,<4",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrum"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the running containers (VRUM_TEST_URL); run through ./check.sh",
]
addopts = "-p no:cacheprovider"
